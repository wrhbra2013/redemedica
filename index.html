<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Rede.Médica - Agendamentos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <button class="hamburger" onclick="toggleDrawer()" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <a class="brand" href="#" onclick="navegar('dashboard');return false;" aria-label="Ir para o início">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </span>
        <span class="brand-text">Rede.Médica</span>
      </a>

      <nav class="top-nav" id="topNav" aria-label="Navegação principal"></nav>

      <div class="header-actions">
        <button class="btn btn-secondary header-admin-btn" id="btnAdminAuth" onclick="alternarAutenticacao()"></button>
        <button class="btn btn-secondary header-admin-btn" id="btnQrAcesso" onclick="abrirModalQr()" title="QR Code de acesso pelo celular" style="display:none"></button>
        <div class="api-pill" id="apiPill" title="Clique para reconectar caso offline">
          <span class="status-dot" id="statusDot"></span>
          <span class="api-pill-text" id="apiStatusText">Conectando...</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema"></button>
        <button class="btn btn-primary header-btn" id="btnNovo" onclick="abrirModal()" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="btn-label">Novo</span>
        </button>
      </div>
    </div>
  </header>

  <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleDrawer()"></div>

  <nav class="drawer" id="drawer" aria-label="Menu">
    <div class="drawer-header">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <span class="drawer-brand-text">
        <span class="drawer-title">Rede.Médica</span>
        <span class="drawer-subtitle">Agendamentos</span>
      </span>
      <button class="drawer-close" onclick="toggleDrawer()" aria-label="Fechar menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <ul class="drawer-nav" id="drawerNav"></ul>

    <div class="drawer-footer">
      <button class="btn btn-secondary btn-sm drawer-admin-btn" id="btnAdminAuthDrawer" onclick="alternarAutenticacao()"></button>
      <div class="drawer-footer-row">
        <div class="api-pill" id="apiPillDrawer" title="Clique para reconectar caso offline">
          <span class="status-dot" id="statusDotDrawer"></span>
          <span class="api-pill-text" id="apiStatusTextDrawer">Conectando...</span>
        </div>
        <span class="drawer-meta">v1.0.0</span>
      </div>
    </div>
  </nav>

  <main class="content">
    <div class="content-header">
      <div class="header-left">
        <div class="page-icon" id="pageIcon"></div>
        <div class="header-titles">
          <h2 id="pageTitle">Dashboard</h2>
          <p class="subtitle" id="pageSubtitle">Visão geral dos agendamentos</p>
        </div>
      </div>
    </div>

    <div class="page-content" id="pageContent">
    </div>

    <footer class="page-footer">
      <div class="footer-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <div class="footer-brand-text">
          <span class="footer-name" id="footerName">Rede.Médica</span>
          <span class="footer-tagline" id="footerTagline">Agendamento médico por assinatura</span>
        </div>
      </div>
      <div class="footer-contact">
        <span class="footer-label" id="footerLabel">Consulta e agendamento</span>
        <a class="footer-link" id="footerTel" href="tel:+5511999999999" title="Ligar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          Telefone
        </a>
        <a class="footer-link wa" id="footerWa" href="https://wa.me/5511999999999?text=Ol%C3%A1%2C%20gostaria%20de%20agendar%20uma%20consulta." target="_blank" rel="noopener" title="WhatsApp">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
          WhatsApp
        </a>
      </div>
      <div class="footer-meta">
        <span class="footer-version">v1.0.0</span>
        <span class="footer-copy">© 2026 Rede.Médica</span>
      </div>
    </footer>
  </main>

  <div class="modal-overlay" id="modalOverlay" onclick="fecharModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modalTitle">Novo Registro</h3>
        <button class="modal-close" onclick="fecharModal()" aria-label="Fechar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" id="btnSalvar" onclick="salvarRegistro()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
